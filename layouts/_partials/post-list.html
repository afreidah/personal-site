{{- /* Takes a page collection; renders one row per post. */ -}}
<ul class="post-list">
  {{- range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{- end }}
</ul>
