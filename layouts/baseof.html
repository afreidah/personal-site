<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <main class="container">
    {{- partial "header.html" . }}
    {{- block "main" . }}{{ end }}
    {{- partial "footer.html" . }}
  </main>
  {{- with slice (resources.Get "js/theme.js") (resources.Get "js/copy.js") (resources.Get "js/zoom.js") | resources.Concat "js/site.js" | minify | fingerprint }}
  <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
  {{- end }}
</body>
</html>
