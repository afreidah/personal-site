# Open source contributions, same schema as projects.yaml.
- name: HashiCorp Nomad
  logo: nomad.png
  tagline: Jobs missing from the jobs list, and its pagination
  summary: Two changes to how the hashicorp/nomad web UI jobs page and its `/v1/jobs/statuses` endpoint list jobs.
  groups:
    - title: "Jobs missing from the statuses endpoint and UI ([PR #28158](https://github.com/hashicorp/nomad/pull/28158))"
      items:
        - Jobs written in the same Raft transaction (such as mass rescheduling after a node failure) share a `ModifyIndex`, and silently vanished from the endpoint and the UI while still appearing via `/v1/jobs` and the CLI
        - "Root cause: the jobs-table `modify_index` memdb index was declared unique, but `ModifyIndex` is not unique across jobs, so colliding jobs were dropped from any query iterating that index"
        - Submitted a written root-cause analysis, a live-cluster reproduction, and a self-contained Docker A/B harness; the change marks the index non-unique, adds a regression test, and was backported to release branches
        - Found and reported the pagination bug the change exposed, which led to the follow-up below
    - title: "Jobs list pagination ([PR #28178](https://github.com/hashicorp/nomad/pull/28178))"
      items:
        - With the index non-unique, a cursor built from `ModifyIndex` alone duplicated jobs at page boundaries, stalled on large tied groups so older jobs became unreachable, and broke the "Last" page
        - Added a namespace/ID tiebreaker to the cursor matching the state store's walk order, with older bare-index tokens still accepted
        - Reworked the UI to page only with server-issued tokens, so a mixed-version cluster mid-upgrade still pages correctly in either direction
        - Also stopped jobs outside the active filter appearing when paging backward, and made paging work after a refresh or from a shared link; covered by Go and UI acceptance tests
  links:
    - { label: "PR #28158", url: "https://github.com/hashicorp/nomad/pull/28158" }
    - { label: "PR #28178", url: "https://github.com/hashicorp/nomad/pull/28178" }

- name: Wander
  logo: wander.svg
  tagline: List pagination that repeated pages forever, and multi-node integration tests in Go
  summary: Two changes to [Wander](https://openwander.org/wander/), the open source workload orchestrator.
  groups:
    - title: "List pagination that repeated pages forever ([PR #56](https://github.com/open-wander/wander/pull/56))"
      items:
        - "Found and reported the bug ([issue #55](https://github.com/open-wander/wander/issues/55)): paging through a list could repeat forever, because the paginator compared `next_token` cursors as whole strings while the state store orders them field by field (`team` before `team-a`, create index 9 before 10)"
        - "The change gives the structs tokenizer an optional comparer that compares each cursor field in index order, with the create index compared as a number; the token format is unchanged and other tokenizers still compare as strings"
        - "Ordering tests and a namespace pagination test fail before the change and pass with it"
    - title: "Go integration tests for a multi-node cluster ([PR #60](https://github.com/open-wander/wander/pull/60))"
      items:
        - "First stage of moving the integration testing to Go and Testcontainers, as its own Go module so Testcontainers stays out of the release binary's dependencies"
        - "`TestMain` builds the node image from the checkout's binary, starts the Compose cluster, and removes it with its volumes at the end; a failing test saves every container's log"
        - "Tests drive the cluster through Wander's `api` package on published ports, covering cluster formation, client readiness with healthy drivers, and variable replication checked with stale reads"
        - "Every wait has a timeout, writes are never retried, images are pinned by digest, and `t.Cleanup` undoes test writes"
  links:
    - { label: "PR #56", url: "https://github.com/open-wander/wander/pull/56" }
    - { label: "Issue #55", url: "https://github.com/open-wander/wander/issues/55" }
    - { label: "PR #60", url: "https://github.com/open-wander/wander/pull/60" }

