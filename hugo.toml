baseURL = "https://alexfreidah.com/"
languageCode = "en-us"
title = "Alex Freidah"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  role = "Senior Infrastructure / Platform Engineer"
  description = "Senior Infrastructure / Platform Engineer, 15+ years across cloud and bare-metal: HashiCorp stack, Terraform, Go services, CI/CD, infrastructure as code (IaC)."
  email = "alex.freidah@gmail.com"
  github = "https://github.com/afreidah"
  linkedin = "https://www.linkedin.com/in/alex-freidah/"
  discord = "afreidah"
  location = "Los Angeles, CA"
  # Public by design (ships in the page source); names the Web Analytics site.
  webAnalyticsToken = "cde24484aa254648a5f6277dc5e298e7"

[markup.goldmark.renderer]
  unsafe = true

# Stand-alone images render as figures, which can't be nested in a <p>.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# The post rail lists sections, so only h2. Nesting a second level into a
# 220px column reads as a wall of wrapped text.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false

[markup.highlight]
  noClasses = true
  style = "github-dark"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
