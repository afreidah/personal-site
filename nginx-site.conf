# -------------------------------------------------------------------------------
# Redirect and error handling for alexfreidah.com.
#
# nginx sits behind Traefik, which terminates TLS. Absolute redirects would be
# built from nginx's own view of the request (http, port 80), so the trailing-
# slash redirect for /resume would point crawlers at http://...:80/resume/.
# Relative redirects keep the scheme and host the client actually used.
#
# Unknown paths serve Hugo's 404 page with a real 404 status, so search
# consoles don't report them as soft 404s.
# -------------------------------------------------------------------------------

absolute_redirect off;

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
